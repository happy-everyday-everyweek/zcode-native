name: agent-fanout

# 在 GHA 上跑云端 zcode Agent：一次 dispatch 把一批文件分派给 N 个并行 runner。
# 每个 runner 只改一个文件（在 job 内可选用 compile-entry 做单入口校验），最后把 patch 作为
# artifact 交回，由 collect job 汇总成一个提交推上去。
#
# 一次性准备（已在本机完成）：
#   * release 资产 zcode-runtime-v3.14.3/zcode-runtime-3.14.3.tar.gz（~63MB，公开可下载）
#   * secret ZCODE_PROVIDER_CONFIG_B64（~3KB，base64 后的 provider_config.json）
#
# 用法：
#   curl -X POST -H "Authorization: Bearer <PAT>" \
#     https://api.github.com/repos/<owner>/<repo>/actions/workflows/agent-fanout.yml/dispatches \
#     -d '{"ref":"main","inputs":{"files":"[\"path/a.ts\"]","entry_map":"{\"path/a.ts\":\"server\"}","max_parallel":"2"}}'

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: '基线提交（默认 main）'
        required: false
        default: 'main'
      files:
        description: '要修的文件 JSON 数组'
        required: true
      entry_map:
        description: '文件→入口名 的 JSON（用于 job 内单入口校验，可留空 {}）'
        required: false
        default: '{}'
      max_parallel:
        description: '并行度（受供应商限流约束，建议 4~6）'
        required: false
        default: '5'
      runtime_url:
        description: 'zcode 运行时 tar.gz 的下载地址（默认用本仓库 release 资产）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        file: ${{ fromJSON(inputs.files) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 下载并解开 zcode 运行时
        env:
          RUNTIME_URL: ${{ inputs.runtime_url }}
        run: |
          url="$RUNTIME_URL"
          if [ -z "$url" ]; then
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/zcode-runtime-v3.14.3/zcode-runtime-3.14.3.tar.gz"
          fi
          echo "fetching $url"
          curl -fL --retry 3 -o runtime.tgz "$url"
          mkdir -p "$HOME/.zcode"
          tar -xzf runtime.tgz -C "$HOME/.zcode"
          test -f "$HOME/.zcode/runtime/zcode/bin/zcode.mjs" && echo "runtime OK"

      - name: 注入 provider 配置（走 env，不插值进 shell）
        env:
          ZCODE_PROVIDER_CONFIG_B64: ${{ secrets.ZCODE_PROVIDER_CONFIG_B64 }}
        run: python3 ci/gha-agent.py prepare

      - name: 组装 prompt
        run: python3 ci/gha-agent.py prompt "${{ matrix.file }}"

      - name: 跑 Agent（只允许改这一个文件）
        env:
          ZCODE_ENTRY: ${{ fromJSON(inputs.entry_map)[matrix.file] }}
        run: |
          node "$HOME/.zcode/runtime/zcode/bin/zcode.mjs" -p "$(cat agent-prompt.txt)" --no-color 2>&1 | tail -100
          echo "---- changed files ----"
          git status --porcelain
        continue-on-error: true

      - name: 安装 scriptc（与 CI 同版本，用于单入口校验）
        run: |
          mkdir -p scriptc-try
          cd scriptc-try
          npm install scriptc@0.1.7 --no-audit --no-fund
          ls node_modules/.bin/scriptc

      - name: 编译校验（只编该文件所属入口）
        env:
          ZCODE_ENTRY: ${{ fromJSON(inputs.entry_map)[matrix.file] }}
        run: |
          if [ -z "$ZCODE_ENTRY" ]; then echo "no entry mapping; skipping compile check"; exit 0; fi
          python3 ci/gha-agent.py verify "$ZCODE_ENTRY" "${{ matrix.file }}" || echo "(校验失败：该文件仍有错误，或见上方输出)"
        continue-on-error: true

      - name: 导出 patch
        run: |
          git diff -- "${{ matrix.file }}" > fix.patch
          wc -c fix.patch

      - uses: actions/upload-artifact@v4
        with:
          name: fix-${{ strategy.job-index }}
          path: fix.patch
          if-no-files-found: warn

  collect:
    needs: fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: fixes
          pattern: fix-*
      - name: 汇总并推送一个提交
        run: |
          shopt -s nullglob
          n=0
          for p in fixes/*/fix.patch; do
            if git apply --whitespace=nowarn "$p" 2>/dev/null; then n=$((n+1)); echo "applied $p"; else echo "skip $p"; fi
          done
          echo "patches applied: $n"
          git config user.name  "gha-agent"
          git config user.email "gha-agent@users.noreply.github.com"
          git add -A
          git diff --cached --stat | tail -30
          git commit -m "fix(port): agent fanout batch" || echo "no changes"
          git push