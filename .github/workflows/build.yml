name: zcode-native

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ZCODE_TAG: v3.14.3

jobs:
  sweep:
    name: dynamic-lane error sweep
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clone ZCode and apply adaptation patch
        run: |
          git clone --depth 1 --branch "$ZCODE_TAG" https://github.com/zai-org/ZCode.git ZCode
          cd ZCode
          echo "clean tree at $(git rev-parse HEAD)"
          git apply ../patches/zcode-adaptations.patch
          echo "patch applied"

      - name: Install scriptc
        run: |
          mkdir -p scriptc-try
          cd scriptc-try
          npm init -y >/dev/null 2>&1 || true
          npm install scriptc@0.1.7 --no-audit --no-fund
          cd ..

      - name: Install workspace deps (pnpm) + node types
        run: |
          npm i -g pnpm@10.33.2 >/dev/null 2>&1 || true
          cd ZCode
          pnpm install --ignore-scripts --no-frozen-lockfile
          cd ..
          mkdir -p zfull/node_modules/@types
          ln -sfn "$PWD/ZCode/node_modules/@types/node" zfull/node_modules/@types/node
          ln -sfn "$PWD/ZCode/node_modules/undici-types" zfull/node_modules/undici-types

      - name: Generate dynamic-workflow libs
        run: |
          cd ZCode/apps/zcode-cli/packages/dynamic-workflow
          node scripts/generate-libs.mjs
          cd -

      - name: Build dists
        run: |
          cd ZCode
          pnpm --filter @zcode/core... build
          cd ..

      - name: Sweep every entry on the dynamic lane
        run: |
          cd zfull
          mkdir -p reports
          : > reports/summary.txt
          total=0
          for name in core contracts shared shared-types dynamic-workflow dynamic-workflow-runtime adapters bootstrap telemetry i18n cli tui services provider provider-node rpc client server zcode-server-cli model-option-map formal-proof node-repl-host port-cli port-entry; do
            if [ ! -f "entries/$name.ts" ]; then
              echo "$name=MISSING" >> reports/summary.txt
              continue
            fi
            node ../scriptc-try/node_modules/.bin/scriptc build "entries/$name.ts" --emit c --dynamic > "reports/$name.log" 2>&1
            n=$(grep -c 'error SC' "reports/$name.log" || true)
            total=$((total + n))
            echo "$name=$n" >> reports/summary.txt
          done
          echo "TOTAL=$total" >> reports/summary.txt
          cat reports/summary.txt
          echo '=== top families ==='
          cat reports/*.log | grep 'error SC' | sed 's/.*error SC[0-9]*: //' | sed "s/'[^']*'/X/g" | cut -c1-58 | sort | uniq -c | sort -rn | head -25
          echo '=== top files ==='
          cat reports/*.log | grep 'error SC' | cut -d: -f1 | sed 's|.*/ZCode/||' | sort | uniq -c | sort -rn | head -25

      - name: Upload sweep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-reports
          path: zfull/reports/
          if-no-files-found: warn

  apk:
    name: aarch64 cross-build + APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clone ZCode and apply adaptation patch
        run: |
          git clone --depth 1 --branch "$ZCODE_TAG" https://github.com/zai-org/ZCode.git ZCode
          cd ZCode
          git apply ../patches/zcode-adaptations.patch
          cd ..

      - name: Install scriptc
        run: |
          mkdir -p scriptc-try
          cd scriptc-try
          npm init -y >/dev/null 2>&1 || true
          npm install scriptc@0.1.7 --no-audit --no-fund
          cd ..

      - name: Install workspace deps (pnpm) + node types
        run: |
          npm i -g pnpm@10.33.2 >/dev/null 2>&1 || true
          cd ZCode
          pnpm install --ignore-scripts --no-frozen-lockfile
          cd ..
          mkdir -p zfull/node_modules/@types
          ln -sfn "$PWD/ZCode/node_modules/@types/node" zfull/node_modules/@types/node
          ln -sfn "$PWD/ZCode/node_modules/undici-types" zfull/node_modules/undici-types

      - name: Generate dynamic-workflow libs
        run: |
          cd ZCode/apps/zcode-cli/packages/dynamic-workflow
          node scripts/generate-libs.mjs
          cd -

      - name: Build dists
        run: |
          cd ZCode
          pnpm --filter @zcode/core... build
          cd ..

      - name: Install zig
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          ZIGDIR="$(ls -d /tmp/zig-* | head -n1)"
          echo "$ZIGDIR" >> "$GITHUB_PATH"
          "$ZIGDIR/zig" version

      - name: Install Android NDK r27c
        run: |
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp/ndk
          echo "ANDROID_NDK_ROOT=/tmp/ndk/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Build static slice (library mode, aarch64)
        run: |
          cd zfull
          mkdir -p out
          SCRIPTC_CC=zigcc SCRIPTC_TARGET=aarch64-linux-android \
            node ../scriptc-try/node_modules/.bin/scriptc build --lib --profile profiles/lib-port.profile.json
          find . -name '*.lib.a' -print

      - name: Build dynamic-tier program (aarch64)
        run: |
          cd zfull
          SCRIPTC_CC=zigcc SCRIPTC_TARGET=aarch64-linux-android \
            node ../scriptc-try/node_modules/.bin/scriptc build entries/port-cli.ts --emit=exe --dynamic -o out/zcodecore
          ls -la out/

      - name: Link libzcodecore.so
        run: |
          set -eu
          WS=$GITHUB_WORKSPACE
          NDK=/tmp/ndk/android-ndk-r27c
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          SYSROOT=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          ARCHIVE=$(find "$WS/zfull" -name '*.lib.a' | head -n1)
          echo "archive: $ARCHIVE"
          test -n "$ARCHIVE"
          mkdir -p /tmp/link && cd /tmp/link
          $TC/ld.lld -r --whole-archive "$ARCHIVE" -o combined.o
          CPARM="--target=aarch64-linux-android26 --sysroot=$SYSROOT -O1 -fPIC"
          $TC/clang $CPARM -c "$WS/android-port/jni/zc_compat.c" -o compat.o
          $TC/clang $CPARM -c "$WS/android-port/jni/zcode_jni.c" -o jni.o
          $TC/clang $CPARM -c "$WS/ci/android_child_stubs.c" -o child.o
          $TC/clang $CPARM -c "$WS/ci/android_ucontext_stubs.c" -o uctx.o
          $TC/clang --target=aarch64-linux-android26 --sysroot="$SYSROOT" -fuse-ld=lld -shared \
            -rtlib=compiler-rt --unwindlib=none -Wl,-Bsymbolic \
            -o /tmp/libzcodecore.so jni.o compat.o child.o uctx.o combined.o -lc -lm -llog
          ls -la /tmp/libzcodecore.so
          echo '=== exported zc_/Java_ symbols ==='
          $TC/llvm-readelf -sW /tmp/libzcodecore.so | grep -E 'Java_|zc_' | head -24 || true
          echo '=== unresolved scr_* check ==='
          $TC/llvm-readelf -sW /tmp/libzcodecore.so | awk '$7=="UND" && $8 != "" {print $8}' | grep -v '@' | sort -u > /tmp/und.txt || true
          cat /tmp/und.txt
          if grep -q 'scr_' /tmp/und.txt; then echo 'UNRESOLVED scr_* SYMBOLS'; exit 1; fi
          echo 'no unresolved scr_* symbols'

      - name: Install Android SDK build-tools
        run: |
          mkdir -p /tmp/android
          curl -fsSL -o /tmp/android/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android/cmdline.zip -d /tmp/android/cmdline
          yes | /tmp/android/cmdline/cmdline-tools/bin/sdkmanager --sdk_root=/tmp/android --licenses >/dev/null 2>&1 || true
          yes | /tmp/android/cmdline/cmdline-tools/bin/sdkmanager --sdk_root=/tmp/android "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1
          ls /tmp/android/build-tools/ /tmp/android/platforms/

      - name: Assemble APK
        run: |
          set -eu
          WS=$GITHUB_WORKSPACE
          BT=/tmp/android/build-tools/34.0.0
          AJ=/tmp/android/platforms/android-34/android.jar
          AP=$WS/android-port
          mkdir -p /tmp/apk/classes /tmp/apk/dex /tmp/apk/jni/arm64-v8a
          cp /tmp/libzcodecore.so /tmp/apk/jni/arm64-v8a/libzcodecore.so
          if [ -f "$WS/zfull/out/zcodecore" ]; then
            cp "$WS/zfull/out/zcodecore" /tmp/apk/jni/arm64-v8a/libzcodecore_cli.so
          fi
          javac -source 17 -target 17 -classpath "$AJ" -d /tmp/apk/classes \
            $AP/app/com/zcode/port/MainActivity.java $AP/app/com/zcode/port/NativeCore.java
          "$BT/d8" --min-api 26 --lib "$AJ" --output /tmp/apk/dex /tmp/apk/classes/com/zcode/port/*.class
          "$BT/aapt2" link -I "$AJ" --manifest $AP/AndroidManifest.xml \
            --min-sdk-version 26 --target-sdk-version 34 -o /tmp/apk/app.unsigned.apk
          python3 - <<'PY'
          import os, zipfile
          zf = zipfile.ZipFile('/tmp/apk/app.unsigned.apk', 'a')
          zf.write('/tmp/apk/dex/classes.dex', 'classes.dex')
          for fn in sorted(os.listdir('/tmp/apk/jni/arm64-v8a')):
              zf.write('/tmp/apk/jni/arm64-v8a/' + fn, 'lib/arm64-v8a/' + fn)
          zf.close()
          print('zip updated')
          PY
          "$BT/zipalign" -f 4 /tmp/apk/app.unsigned.apk /tmp/apk/app.aligned.apk
          cp "$WS/ci/zcode-rpc-debug.keystore" /tmp/apk/debug.keystore
          "$BT/apksigner" sign --ks /tmp/apk/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey \
            --out /tmp/apk/zcode-port-debug.apk /tmp/apk/app.aligned.apk
          "$BT/apksigner" verify -v /tmp/apk/zcode-port-debug.apk || true
          unzip -l /tmp/apk/zcode-port-debug.apk
          ls -la /tmp/apk/*.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-aarch64-zcode-port
          path: /tmp/apk/zcode-port-debug.apk
          if-no-files-found: warn
