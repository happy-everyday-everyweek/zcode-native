name: agent-fanout

# 在 GHA 上跑云端 zcode Agent：一次 dispatch 把一批文件分派给 N 个并行 runner。
# 每个 runner 只改一个文件（在 job 内用 compile-entry 做单入口校验），把 patch 作为 artifact
# 交回，由 collect job 汇总成一个提交推上去。
#
# 关键事实（2026-10-03 实测）：本仓库**不含** ZCode 源码树，源码是 runner 里
#   git clone zai-org/ZCode@v3.14.3 + 打 patches/zcode-adaptations.patch 得到的，
# 因此 ZCode 的改动只能通过重新生成 patches/zcode-adaptations.patch 才能落库。
# 文件路径一律按 ZCode 内相对路径给出（例如 packages/server/src/http.ts）。
#
# 一次性准备（已在本机完成）：
#   * release 资产 zcode-runtime-v3.14.3/zcode-runtime-3.14.3.tar.gz（~63MB，公开可下载）
#   * secret ZCODE_PROVIDER_CONFIG_B64（~3KB，provider_config.json）
#
# 用法：
#   curl -X POST -H "Authorization: Bearer <PAT>" \
#     https://api.github.com/repos/<owner>/<repo>/actions/workflows/agent-fanout.yml/dispatches \
#     -d '{"ref":"main","inputs":{"files":"[\"packages/server/src/http.ts\"]","entry_map":"{\"packages/server/src/http.ts\":\"server\"}","max_parallel":"4"}}'

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: '基线提交（默认 main）'
        required: false
        default: 'main'
      files:
        description: '要修的 ZCode 相对路径 JSON 数组'
        required: true
      entry_map:
        description: '文件→入口名 的 JSON（用于 job 内单入口校验，可留空 {}）'
        required: false
        default: '{}'
      max_parallel:
        description: '并行度（受供应商限流约束，建议 4~6）'
        required: false
        default: '5'
      runtime_url:
        description: 'zcode 运行时 tar.gz 的下载地址（默认用本仓库 release 资产）'
        required: false
        default: ''

permissions:
  contents: write

env:
  ZCODE_TAG: v3.14.3

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        file: ${{ fromJSON(inputs.files) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone ZCode 并打改编补丁（与 build.yml 一致）
        run: |
          git clone --depth 1 --branch "$ZCODE_TAG" https://github.com/zai-org/ZCode.git ZCode
          cd ZCode
          git config user.name "gha-agent"
          git config user.email "gha-agent@users.noreply.github.com"
          git apply ../patches/zcode-adaptations.patch
          # 把「改编基线」落成一次提交：否则 HEAD 还是 upstream tag，后面
          # git diff 会把改编补丁自身的内容一起算进 fix.patch，collect 端必然冲突。
          git add -A
          git commit -q -m "adaptation base"
          test -f "${{ matrix.file }}" && echo "target file present: ${{ matrix.file }}"
          cd ..

      - name: 安装 scriptc + 工作区依赖（校验步骤需要）
        run: |
          mkdir -p scriptc-try
          cd scriptc-try
          npm init -y >/dev/null 2>&1 || true
          npm install scriptc@0.1.7 --no-audit --no-fund
          cd ..
          npm i -g pnpm@10.33.2 >/dev/null 2>&1 || true
          cd ZCode
          pnpm install --ignore-scripts --no-frozen-lockfile
          cd ..
          mkdir -p zfull/node_modules/@types
          ln -sfn "$PWD/ZCode/node_modules/@types/node" zfull/node_modules/@types/node
          ln -sfn "$PWD/ZCode/node_modules/undici-types" zfull/node_modules/undici-types

      - name: 下载并解开 zcode 运行时
        env:
          RUNTIME_URL: ${{ inputs.runtime_url }}
        run: |
          url="$RUNTIME_URL"
          if [ -z "$url" ]; then
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/zcode-runtime-v3.14.3/zcode-runtime-3.14.3.tar.gz"
          fi
          echo "fetching $url"
          curl -fL --retry 3 -o runtime.tgz "$url"
          mkdir -p "$HOME/.zcode"
          tar -xzf runtime.tgz -C "$HOME/.zcode"
          test -f "$HOME/.zcode/runtime/zcode/bin/zcode.mjs" && echo "runtime OK"

      - name: 注入 provider 配置（走 env，不插值进 shell）
        env:
          ZCODE_PROVIDER_CONFIG_B64: ${{ secrets.ZCODE_PROVIDER_CONFIG_B64 }}
        run: python3 ci/gha-agent.py prepare

      - name: 组装 prompt
        run: python3 ci/gha-agent.py prompt "${{ matrix.file }}"

      - name: 跑 Agent（只允许改这一个文件）
        run: |
          node "$HOME/.zcode/runtime/zcode/bin/zcode.mjs" -p "$(cat agent-prompt.txt)" --no-color 2>&1 | tail -120
          echo "---- changed files in ZCode ----"
          git -C ZCode status --porcelain
        continue-on-error: true

      - name: 编译校验（只编该文件所属入口）
        env:
          ZCODE_ENTRY: ${{ fromJSON(inputs.entry_map)[matrix.file] }}
        run: |
          if [ -z "$ZCODE_ENTRY" ]; then echo "no entry mapping; skipping compile check"; exit 0; fi
          python3 ci/gha-agent.py verify "$ZCODE_ENTRY" "${{ matrix.file }}" || echo "(校验失败：该文件仍有错误，或见上方输出)"
        continue-on-error: true

      - name: 导出 patch（ZCode 是独立 clone，补丁要从它自己取）
        run: |
          git -C ZCode add -A -- "${{ matrix.file }}"
          git -C ZCode diff --cached -- "${{ matrix.file }}" > fix.patch
          wc -c fix.patch
          head -20 fix.patch

      - uses: actions/upload-artifact@v4
        with:
          name: fix-${{ strategy.job-index }}
          path: fix.patch
          if-no-files-found: warn

  collect:
    needs: fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: fixes
          pattern: fix-*

      - name: 在 ZCode clone 上汇总改动并重新生成改编补丁
        run: |
          git clone --depth 1 --branch "$ZCODE_TAG" https://github.com/zai-org/ZCode.git ZCode
          cd ZCode
          git config user.name  "gha-agent"
          git config user.email "gha-agent@users.noreply.github.com"
          git apply ../patches/zcode-adaptations.patch
          cd ..
          ORIG=$(git -C ZCode rev-parse HEAD)
          echo "upstream base: $ORIG"
          git -C ZCode add -A
          git -C ZCode commit -q -m "adaptation base"
          shopt -s nullglob
          n=0
          for p in fixes/*/fix.patch; do
            if [ -s "$p" ] && git -C ZCode apply --whitespace=nowarn "$p" 2>/dev/null; then
              n=$((n+1)); echo "applied $p"
            else
              echo "skip $p"
            fi
          done
          echo "patches applied: $n"
          if [ "$n" -eq 0 ]; then echo "no fix applied; nothing to push"; exit 0; fi
          # ZCode 不在本仓库里，唯一能落库的形态就是这份改编补丁（对 upstream tag 取 diff，
          # 即「改编基线 + 本轮修复」的完整态）。
          git -C ZCode add -A
          git -C ZCode diff "$ORIG" > patches/zcode-adaptations.patch
          wc -c patches/zcode-adaptations.patch
          git add patches/zcode-adaptations.patch
          git diff --cached --stat | tail -5
          git commit -m "fix(port): agent fanout batch ($n files)" || echo "no changes"
          git push
