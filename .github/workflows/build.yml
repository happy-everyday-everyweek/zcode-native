name: zcode-native

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  emit-c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, contracts, shared, shared-types, dynamic-workflow, dynamic-workflow-runtime, adapters, bootstrap, telemetry, i18n, cli, tui, services, provider, provider-node, rpc, client, server, zcode-server-cli, model-option-map, formal-proof, node-repl-host]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clone ZCode v3.14.3 and apply adaptation patch
        run: |
          git clone --depth 1 --branch v3.14.3 https://github.com/zai-org/ZCode.git ZCode
          cd ZCode
          git apply ../patches/zcode-adaptations.patch
          echo "ZCode ready at $(git rev-parse --short HEAD)."

      - name: Install scriptc (npm)
        run: |
          mkdir -p scriptc-try
          cd scriptc-try
          npm init -y >/dev/null 2>&1 || true
          npm install scriptc@0.1.7 --no-audit --no-fund
          cd ..
      - name: Install and link minimal type deps (Node types + undici for shims)
        run: |
          mkdir -p zfull/node_modules/@types /tmp/nt
          cd /tmp/nt
          npm init -y >/dev/null 2>&1 || true
          npm install --no-audit --no-fund @types/node@25.6.0
          cd "$GITHUB_WORKSPACE"
          ln -sfn /tmp/nt/node_modules/@types/node zfull/node_modules/@types/node
          ln -sfn /tmp/nt/node_modules/undici-types zfull/node_modules/undici-types
          ls -la zfull/node_modules/ zfull/node_modules/@types/
      - name: Install ZCode workspace deps (pnpm)
        run: |
          npm i -g pnpm@10.33.2 >/dev/null 2>&1 || true
          cd ZCode
          pnpm install --ignore-scripts --no-frozen-lockfile
          cd ..
      - name: Re-link @types/node + undici-types from ZCode node_modules
        run: |
          ln -sfn "$PWD/ZCode/node_modules/@types/node" zfull/node_modules/@types/node
          ln -sfn "$PWD/ZCode/node_modules/undici-types" zfull/node_modules/undici-types
          ls -la zfull/node_modules/
      - name: Generate dynamic-workflow libs (gitignored generated file)
        run: |
          cd ZCode/apps/zcode-cli/packages/dynamic-workflow
          node scripts/generate-libs.mjs
          cd -
      - name: Build core dependency-chain dist (contracts, shared, core, ...)
        run: |
          cd ZCode
          pnpm --filter @zcode/core... build
          cd ..




      - name: Build ${{ matrix.pkg }} to C
        run: |
          cd zfull
          mkdir -p out
          node ../scriptc-try/node_modules/.bin/scriptc build entries/${{ matrix.pkg }}.ts --npm-static zod --emit c -o out/${{ matrix.pkg }}.c
          ls -la out/

      - name: Upload C artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-${{ matrix.pkg }}
          path: zfull/out/
          if-no-files-found: warn

  lib-aarch64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Clone ZCode v3.14.3 and apply adaptation patch
        run: |
          git clone --depth 1 --branch v3.14.3 https://github.com/zai-org/ZCode.git ZCode
          cd ZCode
          git apply ../patches/zcode-adaptations.patch
          cd ..
      - name: Install scriptc (npm)
        run: |
          mkdir -p scriptc-try
          cd scriptc-try
          npm init -y >/dev/null 2>&1 || true
          npm install scriptc@0.1.7 --no-audit --no-fund
          cd ..
      - name: Install minimal type deps (Node types + undici for shims)
        run: |
          mkdir -p zfull/node_modules/@types /tmp/nt
          cd /tmp/nt
          npm init -y >/dev/null 2>&1 || true
          npm install --no-audit --no-fund @types/node@25.6.0
          cd "$GITHUB_WORKSPACE"
          ln -sfn /tmp/nt/node_modules/@types/node zfull/node_modules/@types/node
          ln -sfn /tmp/nt/node_modules/undici-types zfull/node_modules/undici-types
      - name: Install zig (x86_64 linux)
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          ZIGDIR="$(ls -d /tmp/zig-* | head -n1)"
          echo "$ZIGDIR" >> "$GITHUB_PATH"
          "$ZIGDIR/zig" version
      - name: Install Android NDK r27c
        run: |
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp/ndk
          echo "ANDROID_NDK_ROOT=/tmp/ndk/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Build zcode-rpc aarch64 static library
        run: |
          cd zfull
          mkdir -p out
          SCRIPTC_CC=zigcc SCRIPTC_TARGET=aarch64-linux-android node ../scriptc-try/node_modules/.bin/scriptc build --lib --profile profiles/rpc.profile.json
          echo '--- out ---'
          ls -la out/ 2>/dev/null || true
          echo '--- .scriptc ---'
          ls -la .scriptc/ 2>/dev/null | head -20 || true
          find . -name '*.lib.a' -o -name '*.a' | head
      - name: Link aarch64 shared library (.so)
        run: |
          NDK=/tmp/ndk/android-ndk-r27c
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          cd zfull/profiles
          $TC/ld.lld -r .scriptc/rpc-probe.lib.a -o /tmp/combined.o
          echo '--- lib.a symbols ---'
          $TC/llvm-nm .scriptc/rpc-probe.lib.a 2>/dev/null | head -40 || true
          echo '--- combined.o defined symbols ---'
          $TC/llvm-nm /tmp/combined.o 2>/dev/null | grep -v ' U ' | head -40 || true
          $TC/clang --target=aarch64-linux-android26 --sysroot="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot" -fuse-ld=lld -shared -rtlib=compiler-rt --unwindlib=none -Wl,-Bsymbolic -o ../out/libzcode_rpc.so /tmp/combined.o -lc -lm
          echo '--- dynamic section ---'
          $TC/llvm-readelf -d ../out/libzcode_rpc.so | head -16 || true
          echo '--- exported symbols ---'
          $TC/llvm-nm -D ../out/libzcode_rpc.so 2>/dev/null | head -24 || true
          ls -la ../out/

      - name: Upload aarch64 library
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lib-aarch64-zcode-rpc
          path: |
            zfull/out/
            zfull/profiles/.scriptc/
          if-no-files-found: warn
          include-hidden-files: true

  coverage-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clone ZCode v3.14.3 and apply adaptation patch
        run: |
          git clone --depth 1 --branch v3.14.3 https://github.com/zai-org/ZCode.git ZCode
          cd ZCode
          git apply ../patches/zcode-adaptations.patch
          echo "ZCode ready."

      - name: Install scriptc (npm)
        run: |
          mkdir -p scriptc-try
          cd scriptc-try
          npm init -y >/dev/null 2>&1 || true
          npm install scriptc@0.1.7 --no-audit --no-fund
          cd ..
      - name: Patch scriptc for diagnostics (locate badType source)
        run: |
          python3 - <<'PYEOF'
          import io
          p = "scriptc-try/node_modules/@scriptc/compiler/dist/frontend/lowering/lowerer.js"
          s = io.open(p, encoding="utf-8").read().split(chr(10))
          assert "throw new PoisonError();" in s[4221], s[4221]
          s.insert(4221, '        try { console.error("[scriptc-diag] badType at", node && node.getSourceFile ? node.getSourceFile().fileName : "?", node && node.getStart ? node.getStart() : "?", this.checker.typeToString(type)); } catch (e) {}')
          io.open(p, "w", encoding="utf-8").write(chr(10).join(s))
          print("diag inserted")
          PYEOF
      - name: Patch scriptc for poison-escape (scan-phase PoisonError catch)
        run: |
          python3 - <<'PYEOF'
          import io
          p = "scriptc-try/node_modules/@scriptc/compiler/dist/frontend/lowering/lowerer.js"
          lines = io.open(p, encoding="utf-8").read().split(chr(10))
          idx = None
          for i, ln in enumerate(lines):
              if "promoteNode(fn);" in ln:
                  idx = i
                  break
          assert idx is not None, "promoteNode(fn) not found"
          assert "if (fn)" in lines[idx - 1], lines[idx - 1]
          lines[idx - 1] = lines[idx - 1].rstrip() + " {"
          lines[idx] = "                    try { promoteNode(fn); } catch (e) { if (!(e instanceof PoisonError)) throw e; }"
          lines.insert(idx + 1, "                }")
          io.open(p, "w", encoding="utf-8").write(chr(10).join(lines))
          print("poison-escape patch applied")
          PYEOF

      - name: Install ZCode workspace deps (pnpm)
        run: |
          npm i -g pnpm@10.33.2 >/dev/null 2>&1 || true
          cd ZCode
          pnpm install --ignore-scripts --no-frozen-lockfile
          cd ..

      - name: Link @types/node + undici-types (so scriptc adopts real Node types)
        run: |
          mkdir -p zfull/node_modules/@types
          ln -sfn "$PWD/ZCode/node_modules/@types/node" zfull/node_modules/@types/node
          test -d "$PWD/ZCode/node_modules/undici-types" || { echo 'undici-types missing'; exit 1; }
          ln -sfn "$PWD/ZCode/node_modules/undici-types" zfull/node_modules/undici-types
          ls -la zfull/node_modules/@types/
          ls -la zfull/node_modules/undici-types/ 2>/dev/null || true

      - name: Generate dynamic-workflow libs (gitignored generated file)
        run: |
          cd ZCode/apps/zcode-cli/packages/dynamic-workflow
          node scripts/generate-libs.mjs
          cd -

      - name: Build core dependency-chain dist (contracts, shared, core, ...)
        run: |
          cd ZCode
          pnpm --filter @zcode/core... build
          cd ..

      - name: Full coverage sweep (22 entries)
        run: |
          cd zfull
          mkdir -p reports
          for name in core contracts shared shared-types dynamic-workflow dynamic-workflow-runtime adapters bootstrap telemetry i18n cli tui services provider provider-node rpc client server zcode-server-cli model-option-map formal-proof node-repl-host; do
            echo "===== $name ====="
            node ../scriptc-try/node_modules/.bin/scriptc coverage entries/$name.ts > reports/$name.cov.log 2>&1 || true
            echo "done $name ($(wc -c < reports/$name.cov.log) bytes)"
          done
          echo ALL-DONE

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: zfull/reports/
          if-no-files-found: warn